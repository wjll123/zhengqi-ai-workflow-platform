# 政企存量平台 · 本地 / 自托管 Docker Compose 编排
# 与 Render（render.yaml, runtime: docker）共用同一份 Dockerfile（全离线依赖版）。
#
# 用法：
#   1) 可直接 build（离线依赖已随仓库提供，无需任何源/代理）：
#        docker compose build
#   2) 起服务：
#        docker compose up -d
#   3) 浏览器打开 http://localhost:8848
#
# 可选：开启访问鉴权（HTTP Basic）。在 shell 或 .env 中设置：
#        ZQC_AUTH_USER=admin
#        ZQC_AUTH_PASS=<你的密码>
#      两者都设才生效；只设一个或都不设 = 不鉴权（本地开发方便）。
#
# 可选：让月报在容器内可算（artifact-tool 私有包走私有 Git 仓库）：
#        ARTIFACT_GIT_URL=https://<你的私有git>/artifact-tool-private.git
#        ARTIFACT_GIT_TOKEN=<只读 PAT>
#      不设则月报运行时降级，其余任务正常。

services:
  zhengqi:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # artifact-tool 私有仓库（月报用）；未设置则传空，月报降级，其余任务不受影响
        ARTIFACT_GIT_URL: ${ARTIFACT_GIT_URL:-}
        ARTIFACT_GIT_TOKEN: ${ARTIFACT_GIT_TOKEN:-}
    image: zhengqi-ai-workflow:latest
    container_name: zhengqi-ai-workflow
    ports:
      - "8848:10000"          # 宿主机 8848 -> 容器 10000（entrypoint 绑 ${PORT:-10000}）
    environment:
      PORT: "10000"
      ZQC_HOST: "0.0.0.0"
      ZQC_DATA_DIR: "/tmp/zqc-data"
      ZQC_PUBLIC_DEPLOYMENT: "1"
      ZQC_ARTIFACT_NODE: "/usr/local/bin/node"
      ZQC_ARTIFACT_NODE_MODULES: "/opt/artifact/node_modules"
      # 访问鉴权：两者都设才启用（留空 = 不鉴权）
      ZQC_AUTH_USER: ${ZQC_AUTH_USER:-}
      ZQC_AUTH_PASS: ${ZQC_AUTH_PASS:-}
    volumes:
      # 宿主机挂载，避免容器重启/重建后 inbox、outputs、state（调度台账）丢失。
      # entrypoint 用 cp -n 铺设模板与底稿，首次为空目录时自动铺入，之后不覆盖用户数据。
      - ./zqc-data:/tmp/zqc-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/healthz", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s      # 首启含 gunicorn 冷启动 + 模板铺设，给足时间
    restart: unless-stopped
