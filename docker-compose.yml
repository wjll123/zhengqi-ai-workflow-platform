# 政企存量平台 · 本地 / 自托管 Docker Compose 编排
# 与 render.yaml 共用同一份 Dockerfile（全离线依赖版：系统 deb + Python whl 均随仓库提供）。
# 月报已改为 LibreOffice 无头重算，不再依赖 Node / 私有 artifact-tool。
#
# 用法：
#   1) 直接 build（离线依赖已随仓库提供，无需任何源/代理）：
#        docker compose build
#   2) 起服务：
#        docker compose up -d
#   3) 浏览器打开 http://localhost:8848
#
# 访问鉴权（HTTP Basic）：默认账号 admin / 密码 bgsnhr（内置，开箱即用）。
# 如需改账号密码：在 shell 或 .env 中设 ZQC_AUTH_USER / ZQC_AUTH_PASS，并取消下面两行注释。
# 如需关闭鉴权（免登录）：取消下面两行注释并把值留空，例如 ZQC_AUTH_PASS: ""。
#   ⚠️ 不要直接保留 `${ZQC_AUTH_PASS:-}` 而未设变量——那会传空值覆盖默认密码，导致鉴权失效。

services:
  zhengqi:
    build:
      context: .
      dockerfile: Dockerfile
    image: zhengqi-ai-workflow:latest
    container_name: zhengqi-ai-workflow
    ports:
      - "8848:10000"          # 宿主机 8848 -> 容器 10000（entrypoint 绑 ${PORT:-10000}）
    environment:
      PORT: "10000"
      ZQC_HOST: "0.0.0.0"
      ZQC_DATA_DIR: "/tmp/zqc-data"
      ZQC_PUBLIC_DEPLOYMENT: "1"
      # 月报改走内网 winsun-libreoffice 远端转换服务，不再依赖容器内本地 soffice
      LIBREOFFICE_URL: "http://172.18.101.171:48151"
      # 访问鉴权（默认走代码内置 admin/bgsnhr，无需在此设置）：
      # 如需自定义/关闭，取消注释并填值：
      # ZQC_AUTH_USER: "admin"
      # ZQC_AUTH_PASS: "bgsnhr"
    volumes:
      # 宿主机挂载，避免容器重启/重建后 inbox、outputs、state（调度台账）丢失。
      # entrypoint 用 cp -n 铺设模板与底稿，首次为空目录时自动铺入，之后不覆盖用户数据。
      - ./zqc-data:/tmp/zqc-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/healthz", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s      # 首启含 gunicorn 冷启动 + 模板铺设，给足时间
    restart: unless-stopped
