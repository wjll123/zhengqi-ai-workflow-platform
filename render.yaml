services:
  - type: web
    name: zhengqi-ai-workflow
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: ZQC_HOST
        value: 0.0.0.0
      - key: ZQC_DATA_DIR
        value: /tmp/zqc-data
      - key: ZQC_PUBLIC_DEPLOYMENT
        value: "1"
      - key: ZQC_SOFFICE
        value: /usr/lib/libreoffice/program/soffice

      # ---- 访问鉴权（HTTP Basic）----
      # 默认账号 admin / 密码 bgsnhr（写在 app/core/config.py，开箱即用）。
      # 下面两项为可选覆盖：未在 Render 后台设置时不会注入，使用代码默认值。
      # 如需改密码，请在 Render 后台 Environment 设置（ZQC_AUTH_PASS 建议标为 secret）。
      - key: ZQC_AUTH_USER
        sync: false
      - key: ZQC_AUTH_PASS
        sync: false
