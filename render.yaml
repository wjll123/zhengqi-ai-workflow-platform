services:
  - type: web
    name: zhengqi-ai-workflow
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: ZQC_HOST
        value: 0.0.0.0
      - key: ZQC_DATA_DIR
        value: /tmp/zqc-data
      - key: ZQC_PUBLIC_DEPLOYMENT
        value: "1"
      # 以下两个为私有 npm 源凭据，请在 Render 后台 Environment 中设置（构建期可用）：
      #   NPM_REGISTRY_URL = https://<你的私有registry>/<path>/
      #   NPM_TOKEN        = <私有源访问令牌>
      # 不建议写死在仓库；若写在此处，请务必设置为 secret。
      - key: NPM_REGISTRY_URL
        sync: false
      - key: NPM_TOKEN
        sync: false
