services:
  - type: web
    name: zhengqi-ai-workflow
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: ZQC_HOST
        value: 0.0.0.0
      - key: ZQC_DATA_DIR
        value: /tmp/zqc-data
      - key: ZQC_PUBLIC_DEPLOYMENT
        value: "1"

      # ---- 访问鉴权（HTTP Basic）----
      # 两者都设置才启用鉴权；留空 = 不鉴权（任何人可访问）。
      # 请在此处或 Render 后台 Environment 中设置，密码务必设为 secret。
      - key: ZQC_AUTH_USER
        sync: false
      - key: ZQC_AUTH_PASS
        sync: false

      # ---- 月报 artifact-tool（可选）----
      # 月报依赖 OpenAI 私有包 @oai/artifact-tool，需你把它推到一个私有 Git 仓库后在此配置。
      # 不配置则月报运行时降级，其余任务（落责等）正常。
      - key: ARTIFACT_GIT_URL
        sync: false
      - key: ARTIFACT_GIT_TOKEN
        sync: false
