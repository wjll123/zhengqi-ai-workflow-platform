services:
  - type: web
    name: zhengqi-ai-workflow
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: ZQC_HOST
        value: 0.0.0.0
      - key: ZQC_DATA_DIR
        value: /tmp/zqc-data
      - key: ZQC_PUBLIC_DEPLOYMENT
        value: "1"
      # 月报改走内网 LibreOffice 转换服务（公网 Render 连不上 172.18 内网，内网部署时填真实地址）
      - key: LIBREOFFICE_URL
        value: http://172.18.101.171:48151

      # ---- 访问鉴权（HTTP Basic）----
      # 默认账号 admin / 密码 bgsnhr（写在 app/core/config.py，开箱即用）。
      # 下面两项为可选覆盖：未在 Render 后台设置时不会注入，使用代码默认值。
      # 如需改密码，请在 Render 后台 Environment 设置（ZQC_AUTH_PASS 建议标为 secret）。
      - key: ZQC_AUTH_USER
        sync: false
      - key: ZQC_AUTH_PASS
        sync: false
