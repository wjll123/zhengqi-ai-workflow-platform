services:
  - type: web
    name: zhengqi-ai-workflow
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: ZQC_HOST
        value: 0.0.0.0
      - key: ZQC_DATA_DIR
        value: /tmp/zqc-data
      - key: ZQC_PUBLIC_DEPLOYMENT
        value: "1"
      - key: ZQC_SOFFICE
        value: /usr/lib/libreoffice/program/soffice

      # ---- 访问鉴权（HTTP Basic）----
      # 两者都设置才启用鉴权；留空 = 不鉴权（任何人可访问）。
      # 请在此处或 Render 后台 Environment 中设置，密码务必设为 secret。
      - key: ZQC_AUTH_USER
        sync: false
      - key: ZQC_AUTH_PASS
        sync: false
